name: arpanlabs-chatbot
services:
  app:
    build:
      context: .
      dockerfile: aimhi-chatbot/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      FLASK_ENV: production
      PORT: '5000'
      RATE_LIMIT_STORAGE: redis://arpanlabs-chatbot-rate-limit:6379/0
      WEB_CONCURRENCY: '1'
      GUNICORN_CMD_ARGS: --threads 4 --timeout 120 --access-logfile - --error-logfile -
    depends_on:
      redis:
        condition: service_healthy
    networks: [proxy, private]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:5000/healthz', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    labels:
      traefik.enable: 'true'
      traefik.docker.network: ${TRAEFIK_NETWORK:-coolify}
      traefik.http.routers.arpanlabs-chatbot-http.rule: Host(`${CHATBOT_HOST:-chatbot.arpanlabs.com}`)
      traefik.http.routers.arpanlabs-chatbot-http.entrypoints: http
      traefik.http.routers.arpanlabs-chatbot-http.middlewares: arpanlabs-chatbot-https
      traefik.http.middlewares.arpanlabs-chatbot-https.redirectscheme.scheme: https
      traefik.http.middlewares.arpanlabs-chatbot-https.redirectscheme.permanent: 'true'
      traefik.http.routers.arpanlabs-chatbot.rule: Host(`${CHATBOT_HOST:-chatbot.arpanlabs.com}`)
      traefik.http.routers.arpanlabs-chatbot.entrypoints: https
      traefik.http.routers.arpanlabs-chatbot.tls: 'true'
      traefik.http.routers.arpanlabs-chatbot.tls.certresolver: letsencrypt
      traefik.http.services.arpanlabs-chatbot.loadbalancer.server.port: '5000'
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: [redis-server, --save, '', --appendonly, 'no']
    networks:
      private:
        aliases: [arpanlabs-chatbot-rate-limit]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 10s
      timeout: 3s
      retries: 5
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}
networks:
  proxy:
    external: true
    name: ${TRAEFIK_NETWORK:-coolify}
  private: {}
